name: Verify Tasks

on:
  push:
    paths:
      - 'data/tasks/**'
  pull_request:
    paths:
      - 'data/tasks/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install scipy numpy
      - run: python scripts/verify_tasks.py
